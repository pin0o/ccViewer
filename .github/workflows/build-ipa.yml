name: Build unsigned PoC IPA

on:
  push:
    branches: [feature_thumbnail]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          apps = list(pathlib.Path('/Applications').glob('Xcode_26*.app'))
          if not apps:
              raise SystemExit('Xcode 26 is required on this runner')
          app = max(apps, key=lambda p: tuple(map(int, re.findall(r'\d+', p.name))))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'DEVELOPER_DIR={app}/Contents/Developer\n')
          PY

      - name: Test Google sign-in configuration validation
        run: |
          mkdir -p build
          xcrun swiftc RemoteCloud/RemoteCloud/GoogleSignInSettings.swift tests/GoogleSignInSettingsTests.swift -o build/google-signin-settings-tests
          build/google-signin-settings-tests

      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            library/install
            work/output
            GoogleCastSDK-ios-4.8.4_dynamic_xcframework
          key: ios26-arm64-dependencies-v3-${{ hashFiles('.gitmodules', 'library/build.sh', 'scripts/prepare-ios-dependencies.sh', 'work/*.sh', 'work/*.patch') }}
          restore-keys: |
            ios26-arm64-dependencies-v2-

      - name: Build native dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          bash scripts/prepare-ios-dependencies.sh > build/dependencies.log 2>&1 || {
            tail -n 100 build/dependencies.log
            exit 1
          }

      - name: Save native dependencies before compiling the app
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            library/install
            work/output
            GoogleCastSDK-ios-4.8.4_dynamic_xcframework
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Archive and package unsigned IPA
        run: bash scripts/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CryptCloudViewerPoC-unsigned
          path: build/ipa/CryptCloudViewerPoC-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/ipa/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload dependency log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-dependencies-log
          path: build/dependencies.log
          if-no-files-found: ignore
          retention-days: 7
